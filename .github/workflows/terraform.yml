name: Terraform network

on:
  pull_request:
    branches:
      - main
    paths:
      - "network/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "network/**"
      - ".github/workflows/terraform.yml"

concurrency:
  group: terraform-network
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Check formatting
        run: terraform -chdir=network fmt -check -recursive

      - name: Initialize without remote state
        run: terraform -chdir=network init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir=network validate -no-color

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Check formatting
        run: terraform -chdir=network fmt -check -recursive

      - name: Initialize Terraform
        run: terraform -chdir=network init -input=false

      - name: Validate configuration
        run: terraform -chdir=network validate -no-color

      - name: Plan infrastructure changes
        run: terraform -chdir=network plan -input=false -out=tfplan

      - name: Apply infrastructure changes
        run: terraform -chdir=network apply -input=false -auto-approve tfplan
